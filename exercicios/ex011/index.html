<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplkesmente aumente e diminua o tamanho do seu navegador.</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
      <source media="(max-width: 1100px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexível">
    </picture>
    <h1>Reproduzindo aúdio</h1>
    <p>Vamos reproduzir um aúdio</p>
    <audio src="midias/halfway-mp3.mp3" controls autoplay></audio> <!--MP3 WAV oGG-->
    <audio>
        <source src="midias/halfway-mp3.mp3" type="audio/mpeg">
            <source src="midias/halfway-mp3.wav" type="audio/wav">
                <source src="midias/halfway-mp3.ogg" type="audio/ogg">
    </audio>
    <p>Infelizmente seu navegador não consegue reproduzir aúdio. <a href="https://youtu.be/1VEciS5XfaM?si=EPFmd9QAq6WUPxqs" target="_blank" rel="external">Clique aqui</a> para reproduzir o aúdio MP3</p>
</body>
</html>
