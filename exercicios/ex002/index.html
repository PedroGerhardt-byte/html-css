<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linhas</h1>
    <hr>
    <p>Você pode 
        escrever um parágrafo de 
        
        qualquer jeito, 
        
        desde que 
        esteja dentro do par de tags &lt;p&gt; e &lt;/p&gt;</p>
        <p>Um exemplo que quebra é usando a tag &lt;br&gt; <br>Como nesse exemplo</p> <!--lt=LESS THAN/gt=GREATER THAN-->
        <P>vamos adicionar alguns símbolos especiais:
            &reg;
            &copy;
            &trade;
            &euro;
            &pound;
            &Delta;
            &delta;
            <p>vamos adicionar alguns emojis:
                &#x1F601;
                &#x1F412;
                &#x1F6A7;

            </p>

        </P>
</body>
</html>
